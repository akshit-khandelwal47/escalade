spring:
  application:
    name: escalade
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/escalade}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

escalade:
  worker:
    # Set false to stop the background poller (tests drive the engine directly).
    scheduler-enabled: ${ESCALADE_WORKER_ENABLED:true}
    poll-interval-ms: ${ESCALADE_WORKER_POLL_MS:1000}
    batch-size: ${ESCALADE_WORKER_BATCH:50}
    # Demo aid: widens the delivery window so the ack-vs-escalation race is reproducible by hand.
    simulated-send-delay-ms: ${ESCALADE_SIMULATED_SEND_DELAY_MS:0}
