spring:
  application:
    name: escalade
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/escalade}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

escalade:
  worker:
    # Set false to stop the background poller (tests drive the engine directly).
    scheduler-enabled: ${ESCALADE_WORKER_ENABLED:true}
    poll-interval-ms: ${ESCALADE_WORKER_POLL_MS:1000}
    # Max attempts processed per tick (each in its own transaction), not a SQL batch size.
    batch-size: ${ESCALADE_WORKER_BATCH:50}
    # Demo aid: widens the delivery window so the ack-vs-escalation race is reproducible by hand.
    simulated-send-delay-ms: ${ESCALADE_SIMULATED_SEND_DELAY_MS:0}

    # Delivery retries: total tries per attempt, then it dead-letters (escalation still continues).
    max-attempts: ${ESCALADE_MAX_ATTEMPTS:3}
    retry-backoff-seconds: ${ESCALADE_RETRY_BACKOFF_SECONDS:30}
    retry-max-backoff-seconds: ${ESCALADE_RETRY_MAX_BACKOFF_SECONDS:900}

    # How long an incident may sit unacknowledged after escalation runs out of steps
    # before it is marked DEAD_LETTERED, and how often that sweep runs.
    unacked-grace-seconds: ${ESCALADE_UNACKED_GRACE_SECONDS:300}
    sweep-interval-ms: ${ESCALADE_SWEEP_INTERVAL_MS:5000}

  channels:
    # Outbound delivery runs inside the transaction holding the attempt's row lock, so these
    # timeouts bound how long a dead endpoint can stall an escalation. Keep them short.
    http:
      connect-timeout-ms: ${ESCALADE_HTTP_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${ESCALADE_HTTP_READ_TIMEOUT_MS:5000}

    # Each transport activates only when its credential is present; otherwise that channel type
    # falls back to logging. The routing actually in effect is logged at startup.
    slack:
      webhook-url: ${SLACK_WEBHOOK_URL:}
    email:
      api-key: ${RESEND_API_KEY:}
      from: ${ESCALADE_EMAIL_FROM:Escalade <onboarding@resend.dev>}
