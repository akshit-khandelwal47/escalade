services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: escalade
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - escalade_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d escalade"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/escalade
      DB_USER: postgres
      DB_PASSWORD: postgres
      ESCALADE_SEED_DEMO: "true"
    ports:
      - "8080:8080"

volumes:
  escalade_pgdata:
